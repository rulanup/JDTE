name: Compile

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jdte-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile JDTE and the JDTE-AE addon
        run: bash gradlew compileJava --no-daemon --max-workers=2

      - name: Preserve compile reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compile-reports
          path: |
            build/reports/
            jdte-ae/build/reports/
          if-no-files-found: ignore
