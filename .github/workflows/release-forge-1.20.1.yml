name: Forge 1.20.1 Release

on:
  push:
    tags:
      - 'forge-1.20.1-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. forge-1.20.1-v0.6.5.4)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile, test, and package
        run: bash gradlew --no-daemon compileJava test jar

      - name: Read mod version
        id: ver
        run: echo "mod_version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: JDT Extras ${{ steps.ver.outputs.mod_version }} (Forge 1.20.1)
          target_commitish: forge-1.20.1
          make_latest: false
          generate_release_notes: true
          body: |
            Forge 1.20.1 port of JDT Extras ${{ steps.ver.outputs.mod_version }}.
            Requires Minecraft 1.20.1, Forge 47.4.10, Just Dire Things (Forge) 1.1.4, Java 17.
            Feature matrix: V 115 / U 4 / P 2 / N 0. The two greenhouses are hidden (no `jdte_matrix` build for 1.20.1).
          files: build/libs/*.jar
          fail_on_unmatched_files: true
