name: GameTests

# Runs the NeoForge GameTest server. The release workflow also runs it before
# publishing; this one gives feedback on pushes and pull requests.
on:
  push:
    branches:
      - main
    paths:
      - 'src/main/**'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/gametests.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gametests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gametest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run the NeoForge GameTest server
        run: bash gradlew runGameTestServer --no-daemon --max-workers=2

      - name: Upload GameTest logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jdte-gametest-${{ github.sha }}
          path: |
            runs/gameTestServer/logs/**
            runs/gameTestServer/crash-reports/**
          if-no-files-found: warn
          retention-days: 14
